<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>H4 Party</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header><div><h1>H4 PARTY</h1><p>هارون • تاج • سكندر • أيمن</p></div><div id="status">غير متصل</div></header>

<section id="login" class="card">
<h2>🎮 ادخلوا الحفلة</h2>
<input id="name" placeholder="اسمك" maxlength="18">
<div class="row"><button onclick="create()">إنشاء غرفة</button><button class="secondary" onclick="join()">دخول بكود</button></div>
<input id="roomCode" placeholder="كود الغرفة" maxlength="4" style="text-transform:uppercase">
<p class="hint">شغّلوا السيرفر، ثم افتحوا الرابط من أجهزة الأربعة على نفس الشبكة.</p>
</section>

<section id="lobby" class="hidden">
<div class="card"><h2>🏠 الغرفة: <b id="code"></b></h2><div id="players" class="players"></div></div>
<div class="card"><h2>اختروا لعبة</h2><div class="games">
<button onclick="start('challenge')">🧠 Brain Battle</button>
<button onclick="start('likely')">😂 من المرجح أن؟</button>
<button onclick="start('risk')">🎲 مخاطرة</button>
<button onclick="start('auction')">💰 المزاد</button>
</div><button class="secondary" onclick="chatFocus()">💬 الدردشة</button></div>
</section>

<section id="game" class="hidden">
<div class="top"><button class="secondary" onclick="back()">← اللوبي</button><h2 id="gameTitle"></h2></div>
<div id="board" class="card"></div>
</section>

<section id="chat" class="card hidden"><div id="messages"></div><div class="row"><input id="chatInput" placeholder="اكتب شيئًا..."><button onclick="sendChat()">إرسال</button></div></section>
</div>
<script src="app.js"></script>
</body></html>
